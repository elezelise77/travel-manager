<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행 상황판 설치 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F0F2EE; --surface:#FFFFFF; --sunken:#F7F8F5;
  --ink:#151917; --ink-2:#4C554F; --ink-3:#7E877F;
  --line:#DCE0D8; --line-2:#C5CCC1;
  --deep:#1E4A3D; --deep-ink:#E9F1EC; --deep-line:#2F6252; --cream:#F3E9D6;
  --accent:#2C6150; --accent-soft:#DEEAE3; --accent-ink:#1C463A;
  --gold:#9A7B3F; --gold-soft:#F1E8D6;
  --good:#2F7D53; --warm:#A35E27; --crit:#AE3830;
  --shadow:0 1px 2px rgba(21,25,23,.05), 0 10px 28px -20px rgba(21,25,23,.35);
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F1413; --surface:#171D1B; --sunken:#131917;
    --ink:#E6EAE6; --ink-2:#A5AFA9; --ink-3:#76807A;
    --line:#27302C; --line-2:#38423C;
    --deep:#132420; --deep-ink:#DCEAE3; --deep-line:#254036; --cream:#EFE2C9;
    --accent:#6FBF9C; --accent-soft:#182A24; --accent-ink:#9FD9BF;
    --gold:#CBA76A; --gold-soft:#2A2318;
    --good:#65BA8A; --warm:#D9925B; --crit:#E1756C;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -20px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0F1413; --surface:#171D1B; --sunken:#131917;
  --ink:#E6EAE6; --ink-2:#A5AFA9; --ink-3:#76807A;
  --line:#27302C; --line-2:#38423C;
  --deep:#132420; --deep-ink:#DCEAE3; --deep-line:#254036; --cream:#EFE2C9;
  --accent:#6FBF9C; --accent-soft:#182A24; --accent-ink:#9FD9BF;
  --gold:#CBA76A; --gold-soft:#2A2318;
  --good:#65BA8A; --warm:#D9925B; --crit:#E1756C;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -20px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Hahmlet","Nanum Myeongjo",serif;font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
.sm{font-size:12.5px}
.muted{color:var(--ink-3)}
.mono{font-family:"IBM Plex Mono",monospace}

/* ===== 머리 ===== */
header{background:var(--deep);color:var(--deep-ink);padding-block:26px 20px}
header .eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.6;font-weight:600}
header h1{font-size:27px;margin-top:6px;color:var(--deep-ink)}
header p{margin:9px 0 0;font-size:13.5px;opacity:.8;max-width:52ch}
.prog{margin-top:18px;display:flex;align-items:center;gap:11px}
.prog .track{flex:1;height:5px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden}
.prog .fill{height:100%;background:var(--cream);border-radius:99px;width:0;transition:width .4s ease}
.prog .n{font-family:"IBM Plex Mono",monospace;font-size:12px;opacity:.85;white-space:nowrap}

/* ===== 단계 이동 ===== */
nav.steps{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line)}
.striprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.striprow::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  border-radius:99px;padding:6px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:6px}
.pill .dot{width:15px;height:15px;border-radius:50%;background:var(--sunken);border:1px solid var(--line-2);
  font-size:9px;display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;color:var(--ink-3)}
.pill[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.pill[aria-current="true"] .dot{background:rgba(255,255,255,.22);border-color:transparent;color:#fff}
.pill.done{border-color:rgba(47,125,83,.45)}
.pill.done .dot{background:var(--good);border-color:var(--good);color:#fff}
@media (prefers-color-scheme:dark){.pill[aria-current="true"]{color:#0E1412}.pill[aria-current="true"] .dot{color:#0E1412}}

main{padding-block:22px 80px}

/* ===== 단계 카드 ===== */
.stage .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.stage h2{font-size:22px;margin-top:5px}
.stage .lead{color:var(--ink-2);font-size:14px;margin:8px 0 16px}

/* ===== 목업 공통 ===== */
.demo{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden;position:relative}
.demo .cap{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line);
  background:var(--sunken);font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
.demo .cap .replay{margin-left:auto;border:1px solid var(--line-2);background:var(--surface);
  border-radius:7px;padding:4px 10px;font-size:11.5px;cursor:pointer;color:var(--ink-2)}
.demo .cap .replay:hover{border-color:var(--accent);color:var(--accent-ink)}

.scene{position:relative;aspect-ratio:16/10.5;background:var(--sunken);overflow:hidden;
  font-size:clamp(7.5px,2.05vw,11px)}
@media(min-width:700px){.scene{font-size:11px}}

/* 창 크롬 */
.win{position:absolute;inset:4%;background:var(--surface);border:1px solid var(--line);
  border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.wbar{height:2.1em;background:var(--sunken);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.45em;padding:0 .7em;flex:0 0 auto}
.wbar i{width:.55em;height:.55em;border-radius:50%;background:var(--line-2);display:block}
.wbar .t{margin-left:.5em;font-size:.92em;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{display:flex;gap:.15em;padding:.3em .6em;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:nowrap}
.menu span{padding:.2em .45em;border-radius:4px;color:var(--ink-2);white-space:nowrap;font-size:.95em}
.menu span.hot{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.body{flex:1;position:relative;overflow:hidden;background:var(--surface)}

/* 시트 격자 */
.grid{display:grid;grid-template-columns:1.6em repeat(4,1fr);font-size:.92em}
.grid div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:.3em .4em;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.grid .hd{background:var(--sunken);color:var(--ink-3);text-align:center}

/* 드롭다운 */
.drop{position:absolute;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;
  box-shadow:0 10px 26px -10px rgba(0,0,0,.35);padding:.3em 0;min-width:9em;z-index:4}
.drop b{display:block;padding:.32em .8em;font-weight:400;color:var(--ink-2);white-space:nowrap}
.drop b.hot{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}

/* 코드 편집기 */
.editor{display:flex;height:100%}
.files{width:27%;border-right:1px solid var(--line);background:var(--sunken);padding:.5em .45em;flex:0 0 auto}
.files .ft{font-size:.85em;color:var(--ink-3);padding:.2em .3em;display:flex;align-items:center;gap:.3em}
.files .ft .plus{margin-left:auto;width:1.15em;height:1.15em;border-radius:4px;background:var(--surface);
  border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.files .fi{padding:.25em .4em;border-radius:4px;color:var(--ink-2);font-size:.92em;white-space:nowrap;overflow:hidden}
.files .fi.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.code{flex:1;padding:.55em .7em;font-family:"IBM Plex Mono",monospace;font-size:.88em;
  color:var(--ink-3);line-height:1.5;overflow:hidden;position:relative}
.code .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code .sel{position:absolute;inset:.4em .5em auto .5em;height:5.4em;background:rgba(44,97,80,.16);
  border-radius:4px;opacity:0}
.toolbar{display:flex;align-items:center;gap:.4em;padding:.35em .6em;border-bottom:1px solid var(--line);
  background:var(--sunken);flex:0 0 auto;flex-wrap:nowrap}
.tbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:5px;padding:.22em .6em;
  color:var(--ink-2);white-space:nowrap;font-size:.92em}
.tbtn.blue{background:var(--accent);border-color:var(--accent);color:#fff}
.tsel{border:1px solid var(--line-2);background:var(--surface);border-radius:5px;padding:.22em .6em;
  color:var(--ink);white-space:nowrap;font-size:.92em;display:flex;align-items:center;gap:.4em}
.tsel::after{content:"▾";color:var(--ink-3);font-size:.8em}

/* 팝업(권한/배포) */
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:74%;
  background:var(--surface);border:1px solid var(--line-2);border-radius:8px;
  box-shadow:0 18px 46px -18px rgba(0,0,0,.5);padding:.85em .9em;z-index:5}
.modal h4{margin:0 0 .35em;font-size:1.05em;font-family:inherit;font-weight:600}
.modal p{margin:0 0 .5em;font-size:.92em;color:var(--ink-2)}
.modal .frow{display:flex;align-items:center;justify-content:space-between;gap:.5em;
  padding:.28em 0;font-size:.92em;border-top:1px solid var(--line)}
.modal .frow .k{color:var(--ink-3)}
.modal .frow .v{border:1px solid var(--line-2);border-radius:5px;padding:.14em .5em;background:var(--sunken)}
.modal .frow .v.pick{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.modal .acts{display:flex;justify-content:flex-end;gap:.4em;margin-top:.6em}
.urlbox{display:flex;align-items:center;gap:.4em;background:var(--sunken);border:1px solid var(--line);
  border-radius:5px;padding:.3em .5em;font-family:"IBM Plex Mono",monospace;font-size:.82em;color:var(--ink-2)}
.urlbox span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

/* 앱 화면 */
.appbar{background:var(--deep);color:var(--deep-ink);padding:.5em .7em;font-size:.95em;font-weight:600;flex:0 0 auto}
.apptabs{display:flex;gap:.25em;padding:.35em .6em;border-bottom:1px solid var(--line);background:var(--surface);flex:0 0 auto}
.apptabs span{padding:.2em .45em;color:var(--ink-3);white-space:nowrap;font-size:.92em}
.apptabs span.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--accent)}
.formcard{padding:.8em}
.field{margin-bottom:.5em}
.field label{display:block;font-size:.85em;color:var(--ink-3);margin-bottom:.2em}
.field .inp{border:1px solid var(--line-2);border-radius:5px;padding:.3em .5em;background:var(--surface);
  color:var(--ink);font-size:.95em;min-height:1.7em}
.bigbtn{background:var(--accent);color:#fff;border-radius:6px;padding:.35em;text-align:center;font-size:.95em;font-weight:600}

/* 커서 + 클릭 물결 */
.cur{position:absolute;width:1.5em;height:1.5em;left:0;top:0;z-index:9;pointer-events:none;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.ring{position:absolute;width:2.4em;height:2.4em;border-radius:50%;border:2px solid var(--accent);
  z-index:8;opacity:0;pointer-events:none;margin:-1.2em 0 0 -1.2em}
.key{position:absolute;z-index:9;background:var(--ink);color:var(--ground);border-radius:6px;
  padding:.28em .6em;font-family:"IBM Plex Mono",monospace;font-size:.9em;opacity:0;
  box-shadow:0 6px 16px -6px rgba(0,0,0,.5);white-space:nowrap}

/* 애니메이션 재생 제어 : 기본은 멈춤(첫 화면이 그대로 보이게) */
.scene .anim{animation-duration:7s;animation-iteration-count:infinite;animation-fill-mode:both;
  animation-timing-function:ease-in-out;animation-play-state:paused}
.scene.play .anim{animation-play-state:running}
@media (prefers-reduced-motion:reduce){
  .scene .anim{animation:none!important}
  .cur,.ring,.key{display:none}
  .drop,.modal{opacity:1!important;transform:none!important}
  .code .sel{opacity:.6!important}
}
@keyframes appear{ 0%,100%{opacity:0;transform:translateY(-4px) scale(.97)} 6%,94%{opacity:1;transform:none} }
@keyframes tap{ 0%{opacity:0;transform:scale(.4)} 40%{opacity:.9} 100%{opacity:0;transform:scale(1.5)} }
@keyframes keyin{ 0%,100%{opacity:0;transform:translateY(6px)} 8%,92%{opacity:1;transform:none} }
@keyframes selshow{ 0%,100%{opacity:0} 10%,90%{opacity:1} }

/* ===== 설명 ===== */
.explain{margin-top:16px;display:flex;flex-direction:column;gap:11px}
.act{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px}
.act .idx{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;margin-top:1px}
@media (prefers-color-scheme:dark){.act .idx{color:#0E1412}}
.act .tx{flex:1;min-width:0;font-size:13.5px}
.act .tx b{font-weight:600}
.ui{display:inline-block;background:var(--sunken);border:1px solid var(--line-2);border-radius:5px;
  padding:1px 6px;font-size:12.5px;font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.ui.go{background:var(--accent-soft);border-color:rgba(44,97,80,.4);color:var(--accent-ink);font-weight:600}
.warn{background:var(--gold-soft);border:1px solid rgba(154,123,63,.4);border-radius:var(--r);
  padding:12px 14px;font-size:13px;color:var(--ink-2)}
.warn b{color:var(--ink)}
.warn + .warn{margin-top:-2px}

/* ===== 아래 이동 ===== */
.nav{display:flex;gap:9px;margin-top:22px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;
  border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1}
@media (prefers-color-scheme:dark){.btn.primary{color:#0E1412}}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:default}
.done-note{text-align:center;color:var(--good);font-size:13px;margin-top:10px;font-weight:600}
footer{border-top:1px solid var(--line);margin-top:30px;padding-block:20px 0;color:var(--ink-3);font-size:12.5px}

@media(max-width:560px){
  header h1{font-size:23px}
  .stage h2{font-size:20px}
  .btn{padding:12px 14px}
  .nav .btn:not(.primary){padding-inline:13px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="eyebrow">TRIP BOARD · SETUP</div>
    <h1>여행 상황판 설치 가이드</h1>
    <p>구글시트 하나로 친구들과 쓰는 여행 정산·일정 앱을 만듭니다. 화면 그대로 따라만 하면 됩니다.</p>
    <div class="prog">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="n" id="progN">0 / 8</div>
    </div>
  </div>
</header>

<nav class="steps"><div class="wrap striprow" id="strip"></div></nav>

<main class="wrap">
  <div class="stage" id="stage"></div>
  <div class="nav">
    <button class="btn" id="prev">이전</button>
    <button class="btn primary" id="next">이 단계 완료</button>
  </div>
  <div class="done-note" id="doneNote" hidden>✓ 완료한 단계입니다</div>

  <footer>
    진행 상태는 이 기기에 저장됩니다. 중간에 닫아도 이어서 할 수 있습니다.<br>
    막히면 각 단계의 주의 상자를 다시 읽어보세요 — 대부분 거기 적힌 것이 원인입니다.
  </footer>
</main>

<script>
/* ====== 화면(목업) 조각들 ====== */
function cur(path){ return '<svg class="cur anim" style="animation-name:'+path+'" viewBox="0 0 24 24">'+
  '<path d="M5 2l14 9-6 1.2 3.2 6.4-2.6 1.3L10.4 13.5 5 18z" fill="#fff" stroke="#151917" stroke-width="1.3" stroke-linejoin="round"/></svg>'; }
function ring(x,y,d){ return '<div class="ring anim" style="animation-name:tap;animation-delay:'+d+'s;left:'+x+'%;top:'+y+'%"></div>'; }
function key(txt,x,y,d){ return '<div class="key anim" style="animation-name:keyin;animation-delay:'+d+'s;left:'+x+'%;top:'+y+'%">'+txt+'</div>'; }

var SHEET_MENU = '<div class="menu"><span>파일</span><span>수정</span><span>보기</span><span>삽입</span>'+
  '<span>서식</span><span>데이터</span><span>도구</span><span class="hot">확장 프로그램</span><span>도움말</span></div>';
var BLANK_GRID = '<div class="grid">'+
  '<div class="hd"></div><div class="hd">A</div><div class="hd">B</div><div class="hd">C</div><div class="hd">D</div>'+
  '<div class="hd">1</div><div></div><div></div><div></div><div></div>'+
  '<div class="hd">2</div><div></div><div></div><div></div><div></div>'+
  '<div class="hd">3</div><div></div><div></div><div></div><div></div>'+
  '<div class="hd">4</div><div></div><div></div><div></div><div></div></div>';
var SHEET_GRID = '<div class="grid">'+
  '<div class="hd"></div><div class="hd">A</div><div class="hd">B</div><div class="hd">C</div><div class="hd">D</div>'+
  '<div class="hd">1</div><div>이름</div><div>거주지</div><div>출발지</div><div>참석여부</div>'+
  '<div class="hd">2</div><div>홍길동</div><div>서울 구로구</div><div></div><div>참석</div>'+
  '<div class="hd">3</div><div>김철수</div><div>경기 안양시</div><div></div><div>미정</div>'+
  '<div class="hd">4</div><div>이영희</div><div>성남시 분당구</div><div></div><div></div></div>';

var CODE_LINES = ['function doGet(){','  ensureSetup_();','  var t = HtmlService','    .createTemplateFromFile(&quot;Index&quot;);','  return t.evaluate();','}'];
function codeBody(lines){ return lines.map(function(l){return '<div class="ln">'+l+'</div>'}).join(''); }

/* ====== 단계 정의 ====== */
var STEPS = [
{
  id:0, title:'빈 구글시트 만들기',
  lead:'내 구글 계정에 새 스프레드시트를 하나 만듭니다. 남의 시트를 복사하는 게 아니라, 빈 종이에서 시작합니다.',
  scene:
    '<div class="win"><div class="wbar"><i></i><i></i><i></i><div class="t">제목 없는 스프레드시트 — Google Sheets</div></div>'+
    SHEET_MENU+'<div class="body">'+BLANK_GRID+
      '<div class="drop anim" style="animation-name:appear;animation-delay:2.4s;left:6%;top:0">'+
        '<b class="hot">우리 여행</b></div>'+
    '</div></div>'+
    ring(12,9,2.2)+cur('p0'),

/* ====== 그리기 ====== */
var cssBox = document.createElement('style');
cssBox.textContent = STEPS.map(function(s){ return s.css; }).join('\n');
document.head.appendChild(cssBox);

var LS = 'tripGuideDone';
var done = {};
try{ done = JSON.parse(localStorage.getItem(LS) || '{}'); }catch(e){ done = {}; }
var at = 0;
try{ at = Math.min(Number(localStorage.getItem('tripGuideAt')||0), STEPS.length-1); }catch(e){}

function save(){
  try{
    localStorage.setItem(LS, JSON.stringify(done));
    localStorage.setItem('tripGuideAt', String(at));
  }catch(e){}
}
function esc(s){ return String(s==null?'':s); }

function paintStrip(){
  document.getElementById('strip').innerHTML = STEPS.map(function(s,i){
    return '<button class="pill'+(done[s.id]?' done':'')+'" data-go="'+i+'"'+
      (i===at?' aria-current="true"':'')+'>'+
      '<span class="dot">'+(done[s.id]?'✓':(i+1))+'</span>'+esc(s.title)+'</button>';
  }).join('');
  var n = Object.keys(done).filter(function(k){return done[k]}).length;
  document.getElementById('fill').style.width = (n/STEPS.length*100)+'%';
  document.getElementById('progN').textContent = n+' / '+STEPS.length;
  var cur = document.querySelector('.pill[aria-current="true"]');
  if(cur) cur.scrollIntoView({block:'nearest', inline:'center'});
}

function paintStage(){
  var s = STEPS[at];
  document.getElementById('stage').innerHTML =
    '<div class="kicker">'+(at+1)+'단계</div>'+
    '<h2>'+esc(s.title)+'</h2>'+
    '<p class="lead">'+esc(s.lead)+'</p>'+
    '<div class="demo"><div class="cap">움직이는 화면 — 실제 구글 화면과 같은 자리입니다'+
      '<button class="replay" id="replay">다시 재생</button></div>'+
      '<div class="scene" id="scene">'+s.scene+'</div></div>'+
    '<div class="explain">'+
      s.acts.map(function(a,i){
        return '<div class="act"><span class="idx">'+(i+1)+'</span><span class="tx">'+a[0]+'</span></div>';
      }).join('')+
      (s.warn ? '<div class="warn">'+s.warn+'</div>' : '')+
    '</div>';
  document.getElementById('prev').disabled = (at===0);
  document.getElementById('next').textContent =
    done[s.id] ? (at===STEPS.length-1 ? '처음으로' : '다음 단계') : (at===STEPS.length-1 ? '설치 끝!' : '이 단계 완료');
  document.getElementById('doneNote').hidden = !done[s.id];
  document.getElementById('replay').onclick = replay;
  play();
}
function play(){
  var sc = document.getElementById('scene');
  if(sc) requestAnimationFrame(function(){ sc.classList.add('play'); });
}
function replay(){
  var sc = document.getElementById('scene');
  if(!sc) return;
  sc.classList.remove('play');
  void sc.offsetWidth;               // 애니메이션 초기화
  sc.classList.add('play');
}
function go(i){
  at = Math.max(0, Math.min(i, STEPS.length-1));
  save(); paintStrip(); paintStage();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('strip').addEventListener('click', function(e){
  var b = e.target.closest('[data-go]');
  if(b) go(Number(b.dataset.go));
});
document.getElementById('prev').onclick = function(){ go(at-1); };
document.getElementById('next').onclick = function(){
  done[STEPS[at].id] = true;
  if(at === STEPS.length-1){ save(); paintStrip(); paintStage(); }
  else go(at+1);
};

paintStrip();
paintStage();
</script>
</body>
</html>
